service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Một request "tốt" khi trả lời thành công và nhanh; request lỗi (request_failed)
    # hoặc chậm hơn 3000 ms đều tiêu error budget.
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  latency_threshold_ms: 3000
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget:
    # 0.5% của mọi request trong 28 ngày. Quy đổi theo thời gian: 0.5% × 28d × 24h = 3.36 giờ
    # "hỏng hoàn toàn" mỗi cửa sổ. Ví dụ 10 000 request/28d -> tối đa 50 request xấu.
    formula: 'budget_bad_requests = total_requests * (1 - 0.995)'
    time_equivalent_hours: 3.36
    burn_rate: 'bad_ratio_in_window / 0.005'
  rationale: >-
    Baseline đo từ data/logs.jsonl (59 request, 2026-09-29): P50 158 ms, P95 2655 ms,
    P99 2656 ms, TTFT P95 50 ms. Loại các request trong lúc bật incident practice rag_slow,
    traffic bình thường có P50 155 ms, P95 1487 ms, P99 1494 ms; rag_slow đẩy P95/P99 lên
    ~2.6 s. Ngưỡng 3000 ms trùng threshold panel latency, gấp đôi P99 bình thường nên ít báo
    động giả, nhưng rag_slow cộng thêm tải đồng thời sẽ nhanh chóng vượt ngưỡng. Target 99.5% (thay vì 99.9%) vì đây là service
    phụ thuộc LLM/RAG bên ngoài, có tail latency lớn; 0.5% budget đủ để thử prompt version
    mới rồi rollback mà không vi phạm SLO.
  note: Học viên phải giải thích hoặc điều chỉnh ngưỡng bằng baseline của mình.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
